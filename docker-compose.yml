services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: uw_alerts_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uw_alerts_dev"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    ports:
      - "8000:8000"
    environment:
      # Inside the compose network the DB host is the service name "postgres",
      # NOT localhost. This value overrides any DATABASE_URL from .env below.
      DATABASE_URL: postgres://postgres:postgres@postgres:5432/uw_alerts_dev
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: uw-alerts-frontend
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: npm run dev
    depends_on:
      - api

  api:
    build:
      context: ./api
      dockerfile: Dockerfile
    container_name: uw-alerts-api
    ports:
      - "8000:8000"
    environment:
      FLASK_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/uw_alerts_dev
    depends_on:
      - postgres


  scraper:
    build:
      context: .
      dockerfile: docker/scraper.Dockerfile
    container_name: uw-alerts-scraper
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/uw_alerts_dev
      DRY_RUN: "false"
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
    depends_on:
      - postgres
    profiles:
      - jobs

volumes:
  postgres_data:
