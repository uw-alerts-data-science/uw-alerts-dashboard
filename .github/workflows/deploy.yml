# Continuous deployment to DigitalOcean Kubernetes (DOKS).
#
# THE AUTH MODEL (the key idea): this workflow runs on a GitHub-hosted machine
# that is neither your laptop nor your cluster. It proves its identity to
# DigitalOcean with ONE secret you store in GitHub — DIGITALOCEAN_ACCESS_TOKEN.
# From that single token, `doctl` can BOTH log into the container registry AND
# fetch a kubeconfig for the cluster. So one token is all the CI needs.
#
# SETUP (do once):
#   1. DO console -> API -> Generate New Token (read+write). Copy it.
#   2. GitHub repo -> Settings -> Secrets and variables -> Actions:
#        - New repository secret:   DIGITALOCEAN_ACCESS_TOKEN = <the token>
#        - New repository variable: DOKS_CLUSTER_NAME = <your cluster name>
#   3. (Recommended for first deploys) Settings -> Environments -> New
#      environment "production" with yourself as a required reviewer. This pauses
#      every deploy for a manual click before it touches the cluster.

name: deploy

on:
  push:
    branches: [main]        # deploy on every merge to main
  workflow_dispatch:        # ...and allow manual runs from the Actions tab / `gh workflow run`
  # Prefer tag-gated releases instead? Comment the push block above and use:
  # push:
  #   tags: ['v*']

env:
  REGISTRY: registry.digitalocean.com/uwalerts
  IMAGE: registry.digitalocean.com/uwalerts/api

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production        # enables the manual-approval gate configured above
    steps:
      - uses: actions/checkout@v4

      # Installs `doctl` and authenticates it with the token.
      - name: Install doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      # Lets `docker push` authenticate to DOCR (valid ~1h, plenty for a build).
      - name: Log in to DigitalOcean Container Registry
        run: doctl registry login --expiry-seconds 1200

      # Tag by git SHA, NOT :latest. The SHA is immutable and unique per commit,
      # so `kubectl set image` always sees a changed value (=> always rolls out),
      # `kubectl rollout undo` gives real rollback, and `kubectl describe pod`
      # tells you exactly which commit is live. :latest is a moving pointer that
      # may not even trigger a restart.
      - name: Build and push the image
        run: |
          docker build -t "$IMAGE:${{ github.sha }}" -f Dockerfile .
          docker push "$IMAGE:${{ github.sha }}"
          # Also tag :latest for humans browsing the registry (deploy still uses SHA).
          docker tag "$IMAGE:${{ github.sha }}" "$IMAGE:latest"
          docker push "$IMAGE:latest"

      # Writes a kubeconfig pointed at your DOKS cluster so kubectl can talk to it.
      - name: Configure kubectl for the cluster
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DOKS_CLUSTER_NAME }}"

      - name: Deploy
        run: |
          # 1) Apply manifests first, so changes to env/probes/replicas/schedule
          #    are picked up (kubectl set image ONLY changes the image, nothing else).
          kubectl apply -f k8s/app/ -f k8s/db/
          # 2) Point the workloads at the freshly built SHA image.
          kubectl set image deployment/fastapi \
            fastapi="$IMAGE:${{ github.sha }}" -n uwalerts
          kubectl set image cronjob/scraper \
            scraper="$IMAGE:${{ github.sha }}" -n uwalerts
          # 3) Wait for the rollout so a failed deploy fails the workflow (instead
          #    of going green while broken pods crash-loop).
          kubectl rollout status deployment/fastapi -n uwalerts --timeout=120s
