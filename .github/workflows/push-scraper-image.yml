name: Build and Push Scraper Image

on:
  workflow_dispatch:
  push:
    branches:
      - feat/integrate-fast-api
    paths:
      - "scraper/**"
      - "data/**"
      - "docker/scraper.Dockerfile"
      - ".dockerignore"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/push-scraper-image.yml"

permissions:
  contents: read

jobs:
  build-and-push-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install and authenticate doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registries login uwalerts --expiry-seconds 1200

      - name: Generate short image tag
        id: image
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push scraper image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./docker/scraper.Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/uwalerts/uw-alerts-scraper:${{ steps.image.outputs.tag }}
            registry.digitalocean.com/uwalerts/uw-alerts-scraper:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max