name: Build and Push API Image

on:
  workflow_dispatch:

  push:
    branches:
      - main
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "app/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/push-api-image.yml"

permissions:
  contents: read

jobs:
  build-and-push-api:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install and authenticate doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registries login uwalerts --expiry-seconds 1200

      - name: Generate short image tag
        id: image
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push API image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            registry.digitalocean.com/uwalerts/uw-alerts-api:${{ steps.image.outputs.tag }}
            registry.digitalocean.com/uwalerts/uw-alerts-api:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Display pushed image
        shell: bash
        run: |
          echo "API image:"
          echo "registry.digitalocean.com/uwalerts/uw-alerts-api:${{ steps.image.outputs.tag }}"

      # Deploy step. This only rolls out the new API image — it never touches
      # k8s/jobs/ (schema apply, backfill), which stay manual/on-demand only.
      - name: Configure kubectl for the cluster
        run: doctl kubernetes cluster kubeconfig save "${{ vars.DOKS_CLUSTER_NAME }}"

      - name: Apply manifests and roll out the new image
        run: |
          # Apply first, so probe/resource/replica changes in k8s/app/ are
          # picked up (kubectl set image ONLY changes the image, nothing else).
          # This also re-applies postgres.yaml — harmless: an unchanged
          # StatefulSet spec is a no-op and never restarts or touches data.
          kubectl apply -f k8s/app/
          kubectl set image deployment/api \
            api="registry.digitalocean.com/uwalerts/uw-alerts-api:${{ steps.image.outputs.tag }}" \
            -n uw-alerts
          kubectl rollout status deployment/api -n uw-alerts --timeout=120s
