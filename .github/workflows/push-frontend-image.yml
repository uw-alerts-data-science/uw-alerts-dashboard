name: Build and Push Frontend Image

on:
  workflow_dispatch:

  push:
    branches:
      - feat/integrate-fast-api
    paths:
      - "frontend/**"
      - ".github/workflows/push-frontend-image.yml"

permissions:
  contents: read

jobs:
  build-and-push-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install and authenticate doctl
        uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - name: Log in to DigitalOcean Container Registry
        run: doctl registries login uwalerts --expiry-seconds 1200

      - name: Generate short image tag
        id: image
        shell: bash
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push frontend image
        uses: docker/build-push-action@v7
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_API_BASE_URL=https://api.uwalerts.live
          tags: |
            registry.digitalocean.com/uwalerts/uw-alerts-frontend:${{ steps.image.outputs.tag }}
            registry.digitalocean.com/uwalerts/uw-alerts-frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max