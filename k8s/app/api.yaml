# The image tag below is a placeholder — push-api-image.yml runs
# `kubectl set image` to the real just-built tag on every deploy.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: uw-alerts

spec:
  replicas: 1

  selector:
    matchLabels:
      app: api

  template:
    metadata:
      labels:
        app: api

    spec:
      containers:
        - name: api
          image: registry.digitalocean.com/uwalerts/uw-alerts-api:latest
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8000

          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: uw-alerts-secrets
                  key: DATABASE_URL

          startupProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 5
            failureThreshold: 30

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            periodSeconds: 20
            failureThreshold: 5

          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi

---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: uw-alerts

spec:
  type: ClusterIP

  selector:
    app: api

  ports:
    - name: http
      port: 8000
      targetPort: 8000