# A Service is a stable in-cluster address + load balancer for a set of pods.
# Pods come and go (new IPs each time); the Service name stays constant, so the
# Ingress can always reach "fastapi-service" regardless of which pod is serving.
#
# The name MUST be `fastapi-service` — the existing k8s/app/api-ingress.yaml
# already routes api.uwalerts.live to a backend named `fastapi-service` on port 80.
#
# type: ClusterIP means this Service is only reachable *inside* the cluster.
# The internet-facing piece is the Ingress (nginx), not this Service.
apiVersion: v1
kind: Service
metadata:
  name: fastapi-service
  namespace: uwalerts
spec:
  type: ClusterIP
  selector:
    app: fastapi          # matches the pod label in api-deployment.yaml
  ports:
    - port: 80            # the port other cluster resources (the Ingress) call
      targetPort: 8000    # the container's actual port — this is the 80 -> 8000 remap
