# Self-hosted Postgres.
#
# Why a StatefulSet and not a Deployment? A Deployment treats pods as
# interchangeable and gives them random names/no stable disk. A database is a
# "pet": it has ONE disk that must reattach to the SAME pod across restarts, and
# a stable network identity. StatefulSet provides both:
#   - stable pod name: postgres-0
#   - volumeClaimTemplates: a dedicated PersistentVolumeClaim (PVC) that survives
#     pod restarts, backed by a real DigitalOcean block-storage volume.
#
# DURABILITY WARNING (you chose self-hosted): the volume survives pod restarts,
# but NOT a deleted PVC, a deleted namespace, or volume corruption — and there
# are NO automatic backups. Set up DO Volume snapshots and/or a pg_dump CronJob
# early. Never `kubectl delete pvc`. Never set replicas > 1 (vanilla Postgres is
# not multi-primary; more replicas = data corruption).
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: uwalerts
spec:
  serviceName: postgres      # must match the headless Service name
  replicas: 1                # DO NOT increase — see warning above
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          ports:
            - containerPort: 5432
          env:
            # POSTGRES_USER/PASSWORD/DB initialize the database on first boot.
            # The password comes from the same Secret used by the app; it MUST
            # match the password embedded in DATABASE_URL.
            - name: POSTGRES_USER
              value: uwalerts
            - name: POSTGRES_DB
              value: uwalerts
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: uwalerts-secrets
                  key: POSTGRES_PASSWORD
            # Postgres refuses to init if the data dir root isn't empty (e.g. the
            # "lost+found" dir some volumes create). Pointing PGDATA at a subdir
            # sidesteps that classic first-boot failure.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "uwalerts", "-d", "uwalerts"]
            initialDelaySeconds: 10
            periodSeconds: 10
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # do-block-storage is DigitalOcean's CSI driver — this is what turns a
        # PVC into a real, persistent DO Volume.
        storageClassName: do-block-storage
        resources:
          requests:
            storage: 10Gi
