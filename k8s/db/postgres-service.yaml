# Headless Service for Postgres.
#
# `clusterIP: None` makes this "headless": instead of load-balancing across pods,
# it gives each StatefulSet pod a stable DNS name. With one replica you get the
# hostname `postgres` (fully: postgres.uwalerts.svc.cluster.local) resolving to
# postgres-0. This is the host your DATABASE_URL points at:
#     postgres://uwalerts:PW@postgres:5432/uwalerts
#
# A StatefulSet REQUIRES a headless Service, referenced by its `serviceName`.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: uwalerts
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
