# Run-once Job that applies the database schema to a fresh Postgres.
#
# Why a Job (not baked into the DB pod)? Separation of concerns: the DB pod just
# runs Postgres; a Job is a task Kubernetes runs to completion and tracks. It's
# safe to re-run because scraper/db/schema.sql is idempotent (CREATE TABLE IF
# NOT EXISTS ...).
#
# We reuse the API image (registry.digitalocean.com/uwalerts/api) because it
# already contains the `scraper` package + psycopg2. We override the command:
# schema.py exposes apply_schema() but has NO __main__ block, so `python -m` will
# NOT work — we call the function directly with `python -c`.
apiVersion: batch/v1
kind: Job
metadata:
  name: apply-schema
  namespace: uwalerts
spec:
  backoffLimit: 3            # retry up to 3 times on failure
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: apply-schema
          image: registry.digitalocean.com/uwalerts/api:latest
          command:
            - uv
            - run
            - python
            - -c
            - "from scraper.db.schema import apply_schema; apply_schema()"
          envFrom:
            - secretRef:
                name: uwalerts-secrets   # needs DATABASE_URL
